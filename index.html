<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADEM • PS4 HOST</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;color:#fff;background:#050912}
.bg{position:fixed;inset:0;background:
radial-gradient(circle at 18% 25%,rgba(0,140,255,.24),transparent 32%),
radial-gradient(circle at 85% 75%,rgba(75,65,255,.18),transparent 34%),
linear-gradient(135deg,#03060d,#08111e 55%,#050711)}
.grid{position:fixed;inset:-50%;opacity:.12;transform:rotate(-12deg);
background-image:linear-gradient(rgba(255,255,255,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.25) 1px,transparent 1px);
background-size:70px 70px}
.wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:center;padding:25px}
.panel{width:min(760px,94vw);padding:38px;border:1px solid rgba(255,255,255,.12);border-radius:28px;
background:rgba(7,13,24,.76);backdrop-filter:blur(18px);box-shadow:0 30px 100px #0008}
.brand{font-size:12px;letter-spacing:5px;color:#75caff;font-weight:700}
h1{font-size:clamp(44px,8vw,82px);line-height:.95;margin:12px 0 10px;letter-spacing:-4px}
h1 b{font-weight:900}.muted{color:#8996a9}.chips{display:flex;gap:9px;flex-wrap:wrap;margin:25px 0}
.chip{padding:8px 12px;border-radius:99px;background:#ffffff0b;border:1px solid #ffffff12;font-size:12px;color:#b9c4d3}
.main{display:grid;grid-template-columns:1fr 170px;gap:14px}
button{height:58px;border:0;border-radius:16px;color:white;background:linear-gradient(135deg,#087fff,#4652ff);
font-size:16px;font-weight:800;letter-spacing:1px;cursor:pointer;box-shadow:0 12px 35px #1765ff44}
button:active{transform:scale(.985)}button:disabled{opacity:.65}
.side{border:1px solid #ffffff10;border-radius:16px;padding:12px;background:#ffffff05}
.small{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#69778b}.value{margin-top:7px;font-weight:700}
.status{margin-top:18px;padding:12px 14px;border-radius:12px;background:#0004;color:#9eabbc;font-size:12px}
footer{position:fixed;bottom:18px;font-size:10px;color:#566274;letter-spacing:2px}
@media(max-width:600px){.panel{padding:25px}.main{grid-template-columns:1fr}.side{display:flex;gap:20px;align-items:center}h1{letter-spacing:-2px}}
</style>
</head>
<body>
<div class="bg"></div><div class="grid"></div>
<div class="wrap"><section class="panel">
<div class="brand">ADEM • PS4 HOST</div>
<h1>PS4 <span class="muted">HOST</span></h1>
<div class="muted">WebKit Jailbreak • Firmware 13.02 → 13.52</div>
<div class="chips">
<span class="chip">13.02</span><span class="chip">13.50</span><span class="chip">13.51</span><span class="chip">13.52</span>
</div>
<div class="main">
<button id="jb" onclick="launch()">JAILBREAK</button>
<div class="side"><div><div class="small">Host</div><div class="value">ADEM</div></div>
<div><div class="small">Status</div><div class="value" id="state">READY</div></div></div>
</div>
<div class="status" id="log">Ready. Press JAILBREAK to launch the WebKit page.</div>
</section></div>
<footer>ADEM HOST • PS4 13.02 — 13.52</footer>
<script>
function launch(){
 const b=document.getElementById('jb'),s=document.getElementById('state'),l=document.getElementById('log');
 b.disabled=true;s.textContent='STARTING';l.textContent='Opening jb.html…';
 setTimeout(()=>location.href='jb.html?jb=1',450);
}
</script>
</body></html>
