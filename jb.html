<!doctype html>
<html lang="en" manifest="cache.appcache">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>ADEM • PS4 13.02–13.52</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      width: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 35%, #172238 0%, #090d15 48%, #05070b 100%);
      color: #eef3fb;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        system-ui,
        sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Main card */
    #app {
      width: min(680px, calc(100vw - 36px));
      text-align: center;
    }

    #logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      border-radius: 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(145deg, #18253a, #0b111d);

      border: 1px solid rgba(255,255,255,.10);

      box-shadow:
        0 20px 60px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.08);

      font-size: 28px;
      font-weight: 800;
      letter-spacing: -2px;
    }

    #logo span {
      opacity: .95;
    }

    #brand {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: .12em;
      margin-bottom: 8px;
    }

    #subtitle {
      color: #8491a7;
      font-size: 14px;
      letter-spacing: .08em;
      margin-bottom: 42px;
      text-transform: uppercase;
    }

    /* Spinner */
    #spin {
      width: 54px;
      height: 54px;
      margin: 0 auto 25px;

      border-radius: 50%;
      border: 4px solid rgba(255,255,255,.08);
      border-top-color: #fff;

      animation: spin .85s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #msg {
      display: none;

      color: #f0f4fa;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: .02em;
    }

    #status {
      color: #8d9ab0;
      font-size: 13px;
      margin-top: 9px;
    }

    /* Existing jb.js output */
    #wrap {
      display: none;
      margin-top: 25px;
      text-align: left;
    }

    #state {
      display: none;
      margin-bottom: 12px;
      font-size: 20px;
      font-weight: 750;
    }

    #out {
      display: none;
      white-space: pre-wrap;
      overflow-y: auto;

      max-height: 58vh;
      padding: 16px;

      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.09);

      background: rgba(7,10,16,.78);

      color: #aeb9ca;

      font:
        12px/1.55
        "SFMono-Regular",
        Consolas,
        monospace;
    }

    /* States controlled by jb.js */
    body.done #spin {
      display: none;
    }

    body.done #msg {
      display: block;
    }

    body.done #status {
      display: block;
      color: #79d7a0;
    }

    body.fail #spin {
      display: none;
    }

    body.fail #msg {
      display: block;
    }

    body.fail #status {
      display: block;
      color: #e78383;
    }

    /* ?log=1 */
    body.log {
      overflow: auto;
    }

    body.log #app {
      width: min(900px, calc(100vw - 30px));
    }

    body.log #spin,
    body.log #msg,
    body.log #status {
      display: none;
    }

    body.log #wrap {
      display: block;
    }

    body.log #state {
      display: block;
    }

    body.log #out {
      display: block;
    }

    .ok,
    .safe {
      color: #79d7a0;
    }

    .bad,
    .danger {
      color: #e78383;
    }

    .warn {
      color: #dfc477;
    }

    code {
      color: #9db9df;
    }

    #footer {
      position: fixed;
      bottom: 22px;
      left: 0;
      right: 0;

      text-align: center;

      color: #596579;
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    @media (max-width: 500px) {
      #brand {
        font-size: 23px;
      }

      #subtitle {
        font-size: 11px;
      }

      #logo {
        width: 66px;
        height: 66px;
      }
    }
  </style>
</head>

<body>

  <main id="app">

    <div id="logo">
      <span>A</span>
    </div>

    <div id="brand">
      ADEM
    </div>

    <div id="subtitle">
      PS4 • Firmware 13.02 — 13.52
    </div>

    <div id="spin"></div>

    <div id="msg">
      Restart your console
    </div>

    <div id="status">
      Processing...
    </div>

    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>

  </main>

  <div id="footer">
    ADEM • PS4 HOST
  </div>

  <script type="module">
    import "./jb.js?v=10";
  </script>

</body>
</html>
